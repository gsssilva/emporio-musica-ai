[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica-ai"
version = "0.1.0"
description = "Assistente de atendimento da Empório da Música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdf>=6,<7", "httpx>=0.27,<1", "python-dotenv>=1,<2", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]
docs = ["reportlab>=4.4,<5"]

[project.scripts]
emporio-ai = "emporio_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
emporio_ai = ["web/*.html", "prompts/*.txt"]
